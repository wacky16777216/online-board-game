<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>まちまわりオンライン</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>🎲 まちまわりオンライン</h1>
      <p>友達と遊ぶオリジナル・ボードゲーム</p>
    </div>
    <div id="roomBadge" class="badge hidden"></div>
  </header>

  <section id="lobby" class="panel">
    <h2>オンライン対戦</h2>
    <input id="name" maxlength="12" placeholder="あなたの名前">
    <div class="row">
      <button id="create">ルームを作る</button>
      <button id="join">ルームに参加</button>
    </div>
    <div id="joinBox" class="hidden">
      <input id="code" maxlength="6" placeholder="ルームコード">
      <button id="joinNow">参加する</button>
    </div>
    <p id="error" class="error"></p>
  </section>

  <section id="game" class="hidden">
    <div class="topbar">
      <div><b>ルーム:</b> <span id="roomCode"></span></div>
      <button id="copy">招待URLをコピー</button>
      <button id="start">ゲーム開始</button>
    </div>

    <main>
      <div class="board" id="board"></div>
      <aside>
        <div class="panel">
          <h2>プレイヤー</h2>
          <div id="players"></div>
        </div>
        <div class="panel">
          <h2>アクション</h2>
          <button id="roll" class="big">🎲 サイコロを振る</button>
          <button id="buy" class="secondary">🏠 土地を買う</button>
          <p id="turn"></p>
        </div>
        <div class="panel">
          <h2>ログ</h2>
          <div id="log"></div>
        </div>
      </aside>
    </main>
  </section>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/app.js"></script>
</body>
</html>
